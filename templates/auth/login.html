{% extends"base.html" %}
{% block title %}Login — ReghTechLab{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">

 <div class="border border-slate-800 rounded-lg overflow-hidden">
 <div class="flex items-center gap-2 px-4 py-3 
 bg-slate-950 border-b border-slate-800">
 <span class="w-3 h-3 rounded-full bg-red-500/70"></span>
 <span class="w-3 h-3 rounded-full bg-yellow-500/70"></span>
 <span class="w-3 h-3 rounded-full bg-green-500/70"></span>
 <span class="ml-3 text-xs font-mono text-slate-500">
 auth.login
 </span>
 </div>

 <div class="p-8 bg-slate-900">
 <p class="font-mono text-xs text-slate-600 mb-6">
 <span class="text-green-400">$</span>
 ssh user@reghtechlab.com
 </p>

 <h2 class="text-2xl font-bold text-white mb-1">
 Sign In
 </h2>
 <p class="text-slate-400 text-sm mb-8">
 Enter your credentials to continue.
 </p>

 <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-5">
 <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

 <div>
 <label class="block text-xs font-mono 
 text-slate-500 mb-2">
 <span class="text-sky-400">username or email</span>
 </label>
 <input type="text" name="identifier" required autofocus placeholder="john or john@example.com" class="w-full bg-slate-950 border border-slate-700 
 rounded px-4 py-2.5 text-white text-sm
 focus:outline-none focus:border-sky-400
 transition placeholder-slate-600" />
 </div>

  <div>
  <label for="password" class="block text-xs font-mono 
  text-slate-500 mb-2">
  <span class="text-sky-400">password</span>
  </label>
  <div class="password-input-wrapper relative flex items-center">
  <input type="password" id="password" name="password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-700 
  rounded px-4 py-2.5 pr-11 text-white text-sm
  focus:outline-none focus:border-sky-400
  transition placeholder-slate-600" />
  <button type="button"
          onclick="togglePasswordVisibility('password', this)"
          class="password-toggle-btn absolute right-2.5 top-1/2 -translate-y-1/2 p-1.5 text-slate-400 hover:text-sky-400 focus:text-sky-400 rounded-md hover:bg-slate-800/60 focus:outline-none focus:ring-1 focus:ring-sky-500/50 transition-all duration-200 flex items-center justify-center min-w-[32px] min-h-[32px]"
          tabindex="-1"
          aria-label="Show password"
          title="Show password">
    <!-- Lucide Eye Icon (Show password) -->
    <svg class="w-4 h-4 eye-show" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
    <!-- Lucide Eye-Off Icon (Hide password) -->
    <svg class="w-4 h-4 eye-hide hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
      <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
      <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
      <line x1="2" x2="22" y1="2" y2="22"/>
    </svg>
  </button>
  </div>
  </div>

        <div class="flex items-center justify-between">
            <label class="flex items-center space-x-2 cursor-pointer">
                <input type="checkbox" name="remember" class="w-4 h-4 rounded border-slate-700 bg-slate-800 text-sky-500 focus:ring-sky-500 focus:ring-offset-slate-900">
                <span class="text-sm text-slate-300">Remember me</span>
            </label>
            <a href="{{ url_for('auth.reset_password_request') }}" class="text-sm text-sky-400 hover:text-sky-300 transition-colors">Forgot password?</a>
        </div>

 <button type="submit" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-medium py-2.5 rounded
 transition">
 Authenticate
 </button>
 </form>

 <p class="text-center text-slate-600 text-xs 
 font-mono mt-6">
 No account?
 <a href="{{ url_for('auth.register') }}" class="text-sky-400 hover:underline">
 Register here
 </a>
 </p>
 </div>
 </div>
</div>
{% endblock %}
