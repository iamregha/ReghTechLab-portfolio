{% extends "base.html" %}
{% block title %}Set New Password — ReghTechLab{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-20 bg-slate-900 border border-slate-800 p-8 rounded-xl shadow-2xl">
    <h1 class="text-2xl font-bold text-slate-100 mb-6">Set New Password</h1>

    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" class="space-y-5">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        
        <div>
            <label for="password" class="block text-sm font-medium text-slate-300 mb-1">New Password</label>
            <div class="password-input-wrapper relative">
                <input type="password" id="password" name="password" required minlength="8"
                       class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 pr-11 
                              text-slate-100 focus:ring-2 focus:ring-sky-500 focus:border-sky-500 
                              outline-none transition-all">
                <button type="button"
                        onclick="togglePasswordVisibility('password', this)"
                        class="password-toggle-btn absolute inset-y-0 right-0 flex items-center pr-3.5 pl-2 text-slate-400 hover:text-sky-400 focus:text-sky-400 focus:outline-none transition-colors duration-200"
                        tabindex="-1"
                        aria-label="Show password"
                        title="Show password">
                    <svg class="w-4 h-4 eye-show" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <svg class="w-4 h-4 eye-hide hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                        <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                        <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                        <line x1="2" x2="22" y1="2" y2="22"/>
                    </svg>
                </button>
            </div>
        </div>

        <div>
            <label for="confirm_password" class="block text-sm font-medium text-slate-300 mb-1">Confirm New Password</label>
            <div class="password-input-wrapper relative">
                <input type="password" id="confirm_password" name="confirm_password" required minlength="8"
                       class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 pr-11 
                              text-slate-100 focus:ring-2 focus:ring-sky-500 focus:border-sky-500 
                              outline-none transition-all">
                <button type="button"
                        onclick="togglePasswordVisibility('confirm_password', this)"
                        class="password-toggle-btn absolute inset-y-0 right-0 flex items-center pr-3.5 pl-2 text-slate-400 hover:text-sky-400 focus:text-sky-400 focus:outline-none transition-colors duration-200"
                        tabindex="-1"
                        aria-label="Show password"
                        title="Show password">
                    <svg class="w-4 h-4 eye-show" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <svg class="w-4 h-4 eye-hide hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                        <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                        <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                        <line x1="2" x2="22" y1="2" y2="22"/>
                    </svg>
                </button>
            </div>
        </div>

        <button type="submit" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-semibold py-2.5 rounded-lg transition-colors shadow-lg shadow-sky-500/20">
            Update Password
        </button>
    </form>
</div>
{% endblock %}
